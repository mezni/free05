openapi: 3.1.0
info:
  title: bss-core API
  version: 1.0.0
  description: >
    Support application API for customers, orders, shipments, billing, and user management.
    Every operation requires exactly one scope via `get_current_user_with_scope`.
    See docs/AUTHZ-MATRIX.md for the canonical mapping.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Customers
  - name: Orders
  - name: Returns
  - name: Shipments
  - name: Billing
  - name: Users

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Exchange credentials for an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate an access token
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /customers:
    get:
      tags: [Customers]
      summary: List, search, and filter customers
      x-required-scope: Read
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { $ref: "#/components/schemas/CustomerTier" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customers]
      summary: Create a customer
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409": { $ref: "#/components/responses/Conflict" }

  /customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Customers]
      summary: Get a customer profile
      x-required-scope: Read
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Customers]
      summary: Update profile or tier
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      tags: [Customers]
      summary: Delete a customer
      x-required-scope: Write
      responses:
        "204": { description: Deleted }

  /customers/{id}/billing:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Billing]
      summary: Billing history with masked payment data
      x-required-scope: Read
      responses:
        "200":
          description: Billing page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BillingRecord" }
                  next_cursor: { type: [string, "null"] }

  /customers/{id}/orders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Orders]
      summary: Order history with line items and fulfillment status
      x-required-scope: Read
      responses:
        "200":
          description: Order page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor: { type: [string, "null"] }

  /orders:
    post:
      tags: [Orders]
      summary: Create an order
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Orders]
      summary: Get an order with items
      x-required-scope: Read
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{id}/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Orders]
      summary: Add a line item
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderItem" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{id}/items/{itemId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Orders]
      summary: Change item quantity
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderItem" }
    delete:
      tags: [Orders]
      summary: Remove a line item
      x-required-scope: Write
      responses:
        "204": { description: Removed }

  /orders/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Orders]
      summary: Transition order status
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{id}/total:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Orders]
      summary: Get the derived order total
      x-required-scope: Read
      responses:
        "200":
          description: Total
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_amount: { type: string, example: "39.98" }
                  currency: { type: string, example: USD }

  /orders/{id}/items/{itemId}/return-eligibility:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Returns]
      summary: Evaluate return eligibility (deterministic policy)
      x-required-scope: Read
      responses:
        "200":
          description: Eligibility decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible: { type: boolean }
                  reason: { type: string }
    patch:
      tags: [Orders]
      summary: Mark item return eligibility
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_eligible]
              properties:
                return_eligible: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderItem" }

  /returns:
    post:
      tags: [Returns]
      summary: Create a return request and generate a shipping label
      x-required-scope: Write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnRequest" }
        "200":
          description: Replayed idempotent request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /returns/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Returns]
      summary: Get return status and RMA details
      x-required-scope: Read
      responses:
        "200":
          description: Return request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnRequest" }

  /shipments:
    post:
      tags: [Shipments]
      summary: Create a shipment and assign a carrier
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "409": { $ref: "#/components/responses/Conflict" }

  /shipments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Shipments]
      summary: Get shipment detail
      x-required-scope: Read
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }

  /shipments/track/{trackingNumber}:
    parameters:
      - { name: trackingNumber, in: path, required: true, schema: { type: string } }
    get:
      tags: [Shipments]
      summary: Track a shipment by tracking number
      x-required-scope: Read
      responses:
        "200":
          description: Shipment tracking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shipments/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Shipments]
      summary: Update delivery status
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ShipmentStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "409": { $ref: "#/components/responses/Conflict" }

  /shipments/{id}/delivery-date:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Shipments]
      summary: Set the estimated delivery date
      x-required-scope: Write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estimated_delivery_date]
              properties:
                estimated_delivery_date: { type: string, format: date }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }

  /billing:
    post:
      tags: [Billing]
      summary: Create a billing record
      x-required-scope: Financial Write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingRecord" }
        "409": { $ref: "#/components/responses/Conflict" }

  /billing/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Billing]
      summary: Get a billing record
      x-required-scope: Read
      responses:
        "200":
          description: Billing record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingRecord" }

  /billing/refunds:
    post:
      tags: [Billing]
      summary: Issue a refund or credit with mandatory audit logging
      x-required-scope: Financial Write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "201":
          description: Refund executed and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingRecord" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users:
    get:
      tags: [Users]
      summary: Search users
      x-required-scope: User Management
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Create a user
      x-required-scope: User Management
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Users]
      summary: Get a user
      x-required-scope: User Management
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      summary: Update profile, role, or permissions
      x-required-scope: User Management
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [Users]
      summary: Delete a user
      x-required-scope: User Management
      responses:
        "204": { description: Deleted }

  /users/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Users]
      summary: Toggle user active/inactive
      x-required-scope: User Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing required scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (duplicate or invalid state transition)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        required_scope: { type: string }

    Token:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 86400 }

    CustomerTier:
      type: string
      enum: [Standard, Gold, Enterprise]
    OrderStatus:
      type: string
      enum: [Processing, Completed, Returned, Cancelled]
    ShipmentStatus:
      type: string
      enum: [Label Created, In Transit, Out for Delivery, Delivered]
    Carrier:
      type: string
      enum: [FedEx, UPS, DHL]
    BillingType:
      type: string
      enum: [Charge, Refund, Credit]
    BillingStatus:
      type: string
      enum: [Pending, Completed, Failed]
    ReturnStatus:
      type: string
      enum: [Submitted, Approved, Rejected, Completed]
    UserRole:
      type: string
      enum: [Viewer, Operator, Manager, Administrator, User Manager]
    UserStatus:
      type: string
      enum: [active, inactive]

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        tier: { $ref: "#/components/schemas/CustomerTier" }
        preferences: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerCreate:
      type: object
      required: [name, email, tier]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        tier: { $ref: "#/components/schemas/CustomerTier" }
        preferences: { type: object }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        tier: { $ref: "#/components/schemas/CustomerTier" }
        preferences: { type: object }

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: string }
        line_total: { type: string }
        return_eligible: { type: boolean }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total_amount: { type: string }
        currency: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderCreate:
      type: object
      required: [customer_id, items]
      properties:
        customer_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }

    ReturnRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        rma_number: { type: string }
        reason: { type: string }
        quantity: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/ReturnStatus" }
        shipping_label_url: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ReturnCreate:
      type: object
      required: [order_item_id, reason, quantity]
      properties:
        order_item_id: { type: string, format: uuid }
        reason: { type: string }
        quantity: { type: integer, minimum: 1 }

    Shipment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        carrier: { $ref: "#/components/schemas/Carrier" }
        tracking_number: { type: string }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        estimated_delivery_date: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentCreate:
      type: object
      required: [order_id, carrier]
      properties:
        order_id: { type: string, format: uuid }
        carrier: { $ref: "#/components/schemas/Carrier" }

    BillingRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        order_id: { type: [string, "null"], format: uuid }
        type: { $ref: "#/components/schemas/BillingType" }
        amount: { type: string }
        currency: { type: string }
        payment_method_mask: { type: string, example: "Visa ending in 4242" }
        status: { $ref: "#/components/schemas/BillingStatus" }
        created_at: { type: string, format: date-time }
    BillingCreate:
      type: object
      required: [customer_id, type, amount, currency, payment_method_mask]
      properties:
        customer_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/BillingType" }
        amount: { type: string }
        currency: { type: string }
        payment_method_mask: { type: string }
    RefundRequest:
      type: object
      required: [customer_id, amount, reason]
      properties:
        customer_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount: { type: string }
        reason: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        permissions:
          type: array
          items: { type: string }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        operation: { type: string }
        entity_type: { type: string }
